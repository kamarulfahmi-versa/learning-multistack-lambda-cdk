on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  aws_cdk:
    runs-on: ubuntu-latest
    steps:
      
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup pnpm and node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@26

      - name: install dependencies
        run: pnpm install 

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionLambda
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - name: deploy backend if affected
        run: |
          if pnpm nx show projects --affected | grep -qx backend; then
            pnpm nx run backend:deploy
          else
            echo "backend not affected — skipping"
          fi

      - name: deploy console if affected
        run: |
          if pnpm nx show projects --affected | grep -qx console; then
            pnpm nx run console:deploy
          else
            echo "console not affected — skipping"
          fi

      - name: deploy mobile if affected
        run: |
          if pnpm nx show projects --affected | grep -qx mobile; then
            pnpm nx run mobile:deploy
          else
            echo "mobile not affected — skipping"
          fi