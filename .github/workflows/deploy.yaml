on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  aws_cdk:
    runs-on: ubuntu-latest
    steps:
      
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup pnpm and node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@26

      - name: install dependencies
        run: pnpm install 

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionLambda
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        uses: nrwl/nx-set-shas@v5

      - uses: nrwl/nx-set-shas@v5

      - name: compute affected
        id: affected
        run: echo "projects=$(pnpm nx show projects --affected --json)" >> "$GITHUB_OUTPUT"

      - name: deploy backend
        if: contains(fromJSON(steps.affected.outputs.projects), 'backend')
        run: pnpm nx run backend:deploy

      - name: deploy console
        if: contains(fromJSON(steps.affected.outputs.projects), 'console')
        run: pnpm nx run console:deploy

      - name: deploy mobile
        if: contains(fromJSON(steps.affected.outputs.projects), 'mobile')
        run: pnpm nx run mobile:deploy