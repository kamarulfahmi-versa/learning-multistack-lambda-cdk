on: [push]

permissions:
  id-token: write
  contents: read

jobs:
  aws_cdk:
    runs-on: ubuntu-latest
    steps:
      
      - name: checkout
        uses: actions/checkout@v7

      - name: setup pnpm and node
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@26

      - name: install dependencies
        run: pnpm install 

      - name: debug oidc token
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | jq -r '.value' | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GithubActionLambda
          aws-region: ${{ secrets.AWS_REGION }}

      - name: cdk diff
        run: pnpm exec cdk diff --all  --require-approval never

      - name: cdk deploy
        run: pnpm exec cdk deploy --all --require-approval never